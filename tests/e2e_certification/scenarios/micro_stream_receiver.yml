id: "E2E-09"
name: micro_stream_receiver
server_type: michi-micro-server
client_type: michi-music-stream-simulator

# Flujo E2E contra el receiver simulator v1-lite real.
# Micro Server actúa como controlador del Stream.

checks:
  - name: stream_receiver_info
    method: GET
    path: /api/v1/receiver/info
    expected_status: 200
    expected_json:
      service: michi-stream-standard
      api_version: v1-lite
      michi_link_version: 1.0.0-alpha
      auth:
        required: true
        strategy: RECEIVER_BUTTON
        token_refresh: false

  - name: stream_pair_start
    method: POST
    path: /api/v1/receiver/pair/start
    body:
      initiator: michi_micro_server
      initiator_id: micro_e2e
    expected_status: 200
    expected_json:
      status: pairing_window_open
      pairing_window_seconds: 120
    extract:
      stream_nonce: nonce

  - name: stream_pair_confirm
    method: POST
    path: /api/v1/receiver/pair/confirm
    body:
      nonce: "{{ var_stream_nonce }}"
      initiator_id: micro_e2e
      token: tok_e2e_micro
    expected_status: 200
    expected_json:
      status: paired
      controller_id: micro_e2e
    extract:
      stream_token: token

  - name: stream_session_start
    method: POST
    path: /api/v1/receiver/session/start
    auth:
      type: bearer
      token: "{{ var_stream_token }}"
    body:
      session_id: sess_e2e_001
      codec: pcm_s16le
      sample_rate: 48000
      bit_depth: 16
      channels: 2
      transport: udp
      stream_port: 55300
      buffer_ms: 250
      volume: 70
    expected_status: 200
    expected_json:
      status: session_started

  - name: stream_heartbeat
    method: POST
    path: /api/v1/receiver/heartbeat
    auth:
      type: bearer
      token: "{{ var_stream_token }}"
    body:
      session_id: sess_e2e_001
    expected_status: 200
    expected_json:
      status: alive

  - name: stream_volume
    method: POST
    path: /api/v1/receiver/volume
    auth:
      type: bearer
      token: "{{ var_stream_token }}"
    body:
      volume: 50
    expected_status: 200
    expected_json:
      status: volume_set
      volume: 50

  - name: stream_session_stop
    method: POST
    path: /api/v1/receiver/session/stop
    auth:
      type: bearer
      token: "{{ var_stream_token }}"
    body:
      session_id: sess_e2e_001
    expected_status: 200
    expected_json:
      status: session_stopped

  - name: stream_pair_reject_without_window
    method: POST
    path: /api/v1/receiver/pair/confirm
    body:
      nonce: invalid_nonce
      initiator_id: attacker
      token: tok_evil
    expected_status: 409
    expected_json:
      error:
        code: pairing_window_closed

  - name: stream_auth_rejects_invalid
    method: POST
    path: /api/v1/receiver/volume
    auth:
      type: bearer
      token: tok_invalid
    body:
      volume: 50
    expected_status: 401
    expected_json:
      error:
        code: invalid_token
