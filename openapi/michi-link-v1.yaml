      responses:
        "200":
          description: Shuffle state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  shuffle_enabled:
                    type: boolean
                required:
                  - shuffle_enabled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /queue/repeat:
    post:
      tags:
        - Queue
      summary: Set repeat mode
      description: Changes the repeat mode for the queue (off, repeat one, or repeat all).
      operationId: setRepeatMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - off
                    - one
                    - all
                  description: The repeat mode to set. "off" replaces the legacy boolean false value.
              required:
                - mode
      responses:
        "200":
          description: Repeat mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  repeat_mode:
                    type: string
                    enum:
                      - off
                      - one
                      - all
                    description: The updated repeat mode. "off" replaces the legacy boolean false value.
                required:
                  - repeat_mode
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /queue/history:
    get:
      tags:
        - Queue
      summary: Get queue history
      description: Returns the history of previously played tracks.
      operationId: getQueueHistory
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Queue history
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        track_id:
                          type: string
                          format: uuid
                        track:
                          $ref: "#/components/schemas/Track"
                        played_at:
                          type: string
                          format: date-time
                        played_duration:
                          type: integer
                          description: Duration played in milliseconds
                      required:
                        - track_id
                        - played_at
                required:
                  - page
                  - limit
                  - total
                  - items
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # PLAYLISTS
  # ============================================================================
  /playlists:
    get:
      tags:
        - Playlists
      summary: List playlists
      description: Retrieves a paginated list of all playlists in the library.
      operationId: listPlaylists
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum:
              - name
              - trackCount
              - updatedAt
              - createdAt
            default: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: search
          in: query
          required: false
          description: Search query for filtering playlists
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of playlists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Playlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Playlists
      summary: Create playlist
      description: Creates a new empty playlist with the specified name and optional description.
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistCreateRequest"
      responses:
        "201":
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /playlists/{playlistId}:
    get:
      tags:
        - Playlists
      summary: Get playlist
      description: Returns detailed information about a specific playlist including its track listing.
      operationId: getPlaylist
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Playlist details with tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Playlists
      summary: Update playlist
      description: Updates the metadata (name, description) of an existing playlist.
      operationId: updatePlaylist
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistUpdateRequest"
      responses:
        "200":
          description: Playlist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Playlists
      summary: Delete playlist
      description: Permanently removes a playlist from the library.
      operationId: deletePlaylist
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Playlist deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /playlists/{playlistId}/tracks:
    get:
      tags:
        - Playlists
      summary: List playlist tracks
      description: Returns the track listing for a specific playlist with pagination.
      operationId: getPlaylistTracks
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Playlist tracks
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist_id:
                    type: string
                    format: uuid
                  tracks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                required:
                  - playlist_id
                  - tracks
                  - page
                  - limit
                  - total
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Playlists
      summary: Add tracks to playlist
      description: Adds one or more tracks to the end of a playlist.
      operationId: addTracksToPlaylist
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistTracksUpdateRequest"
      responses:
        "200":
          description: Tracks added to playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Playlists
      summary: Replace playlist tracks
      description: Replaces all tracks in the playlist with a new set of tracks.
      operationId: replacePlaylistTracks
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistTracksUpdateRequest"
      responses:
        "200":
          description: Playlist tracks replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Playlists
      summary: Remove tracks from playlist
      description: Removes specific tracks from a playlist by their indices or track IDs.
      operationId: removeTracksFromPlaylist
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                track_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Track IDs to remove from the playlist
                positions:
                  type: array
                  items:
                    type: integer
                  description: 0-based positions of tracks to remove
              anyOf:
                - required:
                    - track_ids
                - required:
                    - positions
      responses:
        "200":
          description: Tracks removed from playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /playlists/{playlistId}/reorder:
    post:
      tags:
        - Playlists
      summary: Reorder playlist tracks
      description: Reorders tracks within a playlist by moving a range of tracks to a new position.
      operationId: reorderPlaylistTracks
      parameters:
        - name: playlistId
          in: path
          required: true
          description: The unique identifier of the playlist
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                range_start:
                  type: integer
                  description: 0-based index of the first track to move
                range_length:
                  type: integer
                  description: Number of tracks to move
                  default: 1
                insert_before:
                  type: integer
                  description: 0-based index where the tracks should be inserted
              required:
                - range_start
                - insert_before
      responses:
        "200":
          description: Playlist tracks reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # DEVICES
  # ============================================================================
  /devices:
    get:
      tags:
        - Devices
      summary: List devices
      description: Returns all registered devices on the network.
      operationId: listDevices
