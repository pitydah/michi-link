        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /devices/{deviceId}:
    get:
      tags:
        - Devices
      summary: Get device
      description: Returns detailed information about a specific registered device.
      operationId: getDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          description: The unique identifier of the device
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # SYNC
  # ============================================================================
  /sync/manifest:
    get:
      tags:
        - Sync
      summary: Get sync manifest
      description: Returns the current manifest version for the library, used to determine if a client's local cache is out of date.
      operationId: getSyncManifest
      responses:
        "200":
          description: Sync manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /sync/delta:
    post:
      tags:
        - Sync
      summary: Get sync delta
      description: Returns the changes (additions, updates, deletions) since a given cursor.
      operationId: getSyncDelta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDelta"
      responses:
        "200":
          description: Delta of changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    type: string
                    description: Opaque cursor for subsequent delta requests
                  added:
                    type: object
                    properties:
                      tracks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"
                      albums:
                        type: array
                        items:
                          $ref: "#/components/schemas/Album"
                      artists:
                        type: array
                        items:
                          $ref: "#/components/schemas/Artist"
                  updated:
                    type: object
                    properties:
                      tracks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"
                      albums:
                        type: array
                        items:
                          $ref: "#/components/schemas/Album"
                      artists:
                        type: array
                        items:
                          $ref: "#/components/schemas/Artist"
                  deleted:
                    type: object
                    properties:
                      track_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                      album_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                      artist_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                  playlists_updated:
                    type: array
                    items:
                      $ref: "#/components/schemas/Playlist"
                    description: Playlists that were added or updated since the cursor
                required:
                  - cursor
                  - added
                  - updated
                  - deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # ROOMS
  # ============================================================================
  /rooms:
    get:
      tags:
        - Rooms
      summary: List rooms
      description: Returns all configured rooms in the system.
      operationId: listRooms
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/Room"
                required:
                  - rooms
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
