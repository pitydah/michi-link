            application/json:
              schema:
                type: object
                properties:
                  artist_id:
                    type: string
                    format: uuid
                  tracks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
                required:
                  - artist_id
                  - tracks
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # SEARCH
  # ============================================================================
  /search:
    get:
      tags:
        - Search
      summary: Search library
      description: Performs a unified search across tracks, albums, and artists in the library.
      operationId: searchLibrary
      parameters:
        - name: q
          in: query
          required: true
          description: The search query string
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Comma-separated list of content types to search
          schema:
            type: string
            default: track,album,artist
            example: track,album
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per result category
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # STREAMING
  # ============================================================================
  /stream/{trackId}:
    get:
      tags:
        - Streaming
      summary: Stream track
      description: |
        Streams the audio data for a specific track. Supports byte-range requests
        for seeking and partial content delivery. Returns the raw audio file with
        appropriate Content-Type headers based on the track's encoding format.
      operationId: streamTrack
      parameters:
        - name: trackId
          in: path
          required: true
          description: The unique identifier of the track to stream
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Byte range request for partial content delivery (e.g., bytes=0-1023)
          schema:
            type: string
            example: bytes=0-1023
        - name: transcode
          in: query
          required: false
          description: Request transcoding to a specific format
          schema:
            type: string
            enum:
              - mp3
              - flac
              - ogg
              - aac
              - wav
        - name: bitrate
          in: query
          required: false
          description: Target bitrate for transcoding in kbps
          schema:
            type: integer
            minimum: 64
            maximum: 320
            example: 192
      responses:
        "200":
          description: Full audio content
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the audio stream
            Content-Length:
              schema:
                type: integer
                format: int64
              description: Total size of the audio content in bytes
            Accept-Ranges:
              schema:
                type: string
                default: bytes
              description: Indicates that byte range requests are supported
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio content (byte range request)
          headers:
            Content-Type:
              schema:
                type: string
              description: MIME type of the audio stream
            Content-Range:
              schema:
                type: string
              description: The byte range included in this response (e.g., bytes 0-1023/1234567)
            Content-Length:
              schema:
                type: integer
                format: int64
              description: Size of the partial content in bytes
            Accept-Ranges:
              schema:
                type: string
                default: bytes
              description: Indicates that byte range requests are supported
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Range not satisfiable
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      content_length:
                        type: integer
                        format: int64
              example:
                error:
                  code: INVALID_REQUEST
                  message: Range not satisfiable
                content_length: 4521984
        "500":
          $ref: "#/components/responses/InternalError"

  /stream/{trackId}/info:
    get:
      tags:
        - Streaming
      summary: Get stream info
      description: Returns metadata about the audio stream for a track without delivering the audio data itself.
      operationId: getStreamInfo
      parameters:
        - name: trackId
          in: path
          required: true
          description: The unique identifier of the track
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stream information
          content:
            application/json:
              schema:
                type: object
                properties:
                  track_id:
                    type: string
                    format: uuid
                  duration:
                    type: number
                    format: float
                    description: Duration in seconds
                  size:
                    type: integer
                    format: int64
                    description: File size in bytes
                  content_type:
                    type: string
                    description: MIME type of the audio
                  bitrate:
                    type: integer
                    description: Bitrate in kbps
                  sample_rate:
                    type: integer
                    description: Sample rate in Hz
                  channels:
                    type: integer
                    description: Number of audio channels
                  format:
                    type: string
                    description: Audio format (mp3, flac, etc.)
                required:
                  - track_id
                  - duration
                  - size
                  - content_type
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /stream/{trackId}/cover:
    get:
      tags:
        - Streaming
      summary: Get track cover art
      description: Returns the embedded cover art image for a specific track.
      operationId: getTrackCover
      parameters:
        - name: trackId
          in: path
          required: true
          description: The unique identifier of the track
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          required: false
          description: Desired image size (small, medium, large)
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: large
      responses:
        "200":
          description: Cover art image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "301":
          description: Redirect to album cover art
          headers:
            Location:
              schema:
                type: string
              description: URL to the album cover art
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /stream/album/{albumId}/cover:
    get:
      tags:
        - Streaming
      summary: Get album cover art
      description: Returns the cover art image for a specific album.
      operationId: getAlbumCover
      parameters:
        - name: albumId
          in: path
          required: true
          description: The unique identifier of the album
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          required: false
          description: Desired image size (small, medium, large)
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: large
      responses:
        "200":
          description: Cover art image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /stream/artist/{artistId}/image:
    get:
      tags:
        - Streaming
      summary: Get artist image
      description: Returns the profile image for a specific artist.
      operationId: getArtistImage
      parameters:
        - name: artistId
          in: path
          required: true
          description: The unique identifier of the artist
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          required: false
          description: Desired image size (small, medium, large)
          schema:
            type: string
            enum:
              - small
              - medium
              - large
            default: large
      responses:
        "200":
          description: Artist image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # PLAYBACK
  # ============================================================================
  /playback/state:
    get:
      tags:
        - Playback
      summary: Get playback state
      description: Returns the current playback state including the currently playing track, position, and status.
      operationId: getPlaybackState
      responses:
        "200":
          description: Current playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/control:
    post:
      tags:
        - Playback
      summary: Control playback
      description: Sends a control command to the active playback session (play, pause, stop, next, previous, seek).
      operationId: controlPlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackControlRequest"
      responses:
        "200":
          description: Command accepted and new state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Playback conflict - no active session
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/now-playing:
    get:
      tags:
        - Playback
      summary: Get now playing
      description: Returns the currently playing track with full metadata.
      operationId: getNowPlaying
      responses:
        "200":
          description: Currently playing track
          content:
            application/json:
              schema:
                type: object
                properties:
                  track:
                    type: object
                    allOf:
                      - $ref: "#/components/schemas/Track"
                    nullable: true
                  progress_ms:
                    type: integer
                    description: Current playback position in milliseconds
                  duration_ms:
                    type: integer
                    description: Total track duration in milliseconds
                  is_playing:
                    type: boolean
                  shuffle_enabled:
                    type: boolean
                  repeat_mode:
                    type: string
                    enum:
                      - off
                      - one
                      - all
                    description: Repeat mode. "off" replaces the legacy boolean false value.
                required:
                  - track
                  - progress_ms
                  - duration_ms
                  - is_playing
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/session:
    post:
      tags:
        - Playback
      summary: Create playback session
      description: Creates a new playback session on a specified device or room.
      operationId: createPlaybackSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionRequest"
      responses:
        "201":
          description: Playback session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                    description: The unique identifier for the playback session
                  status:
                    type: string
                    example: created
                required:
                  - session_id
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Device or room is already in use
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Playback
      summary: Destroy playback session
      description: Ends and cleans up the current playback session.
      operationId: destroyPlaybackSession
      responses:
        "204":
          description: Session destroyed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/session/{sessionId}:
    get:
      tags:
        - Playback
      summary: Get session info
      description: Returns information about a specific playback session.
      operationId: getPlaybackSession
      parameters:
        - name: sessionId
          in: path
          required: true
          description: The unique identifier of the playback session
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session information
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  device_id:
                    type: string
                    nullable: true
                  room_id:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - active
                      - paused
                      - stopped
                      - ended
                  started_at:
                    type: string
                    format: date-time
                  last_activity_at:
                    type: string
                    format: date-time
                required:
                  - session_id
                  - status
                  - started_at
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/volume:
    get:
      tags:
        - Playback
      summary: Get volume
      description: Returns the current volume level for the active playback session.
      operationId: getVolume
      responses:
        "200":
          description: Current volume
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume:
                    type: integer
                    minimum: 0
                    maximum: 100
                    description: Volume level (0-100)
                  muted:
                    type: boolean
                required:
                  - volume
                  - muted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Playback
      summary: Set volume
      description: Sets the volume level for the active playback session.
      operationId: setVolume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                volume:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Volume level (0-100)
              required:
                - volume
      responses:
        "200":
          description: Volume updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume:
                    type: integer
                    minimum: 0
                    maximum: 100
                  muted:
                    type: boolean
                required:
                  - volume
                  - muted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/volume/mute:
    post:
      tags:
        - Playback
      summary: Toggle mute
      description: Toggles the mute state for the active playback session.
      operationId: toggleMute
      responses:
        "200":
          description: Mute state toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted:
                    type: boolean
                required:
                  - muted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /playback/sync/state:
    post:
      tags:
        - Playback
      summary: Sync playback state
      description: Synchronizes the playback state across multiple devices in a group. Used for multi-room synchronization.
      operationId: syncPlaybackState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncStateRequest"
      responses:
        "200":
          description: Sync state acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: synced
                  server_time:
                    type: string
                    format: date-time
                  latency_ms:
                    type: integer
                required:
                  - status
                  - server_time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # QUEUE
  # ============================================================================
  /queue:
    get:
      tags:
        - Queue
      summary: Get queue
      description: Returns the current playback queue with all items, including now playing, upcoming, and history.
      operationId: getQueue
      responses:
        "200":
          description: Current queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Queue
      summary: Replace queue
      description: Replaces the entire playback queue with a new set of tracks.
      operationId: replaceQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tracks:
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: Track IDs in the desired order
              required:
                - tracks
      responses:
        "200":
          description: Queue replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /queue/items:
    post:
      tags:
        - Queue
      summary: Add to queue
      description: Adds one or more tracks to the playback queue at the specified position.
      operationId: addToQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueAddRequest"
      responses:
        "200":
          description: Items added to queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /queue/remove:
    delete:
      tags:
        - Queue
      summary: Remove from queue
      description: Removes one or more items from the playback queue by their queue item IDs.
      operationId: removeFromQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                    description: Queue item IDs to remove
              required:
                - item_ids
      responses:
        "200":
          description: Items removed from queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /queue/clear:
    post:
      tags:
        - Queue
      summary: Clear queue
      description: Removes all upcoming items from the queue. Does not affect the currently playing track.
      operationId: clearQueue
      responses:
        "200":
          description: Queue cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /queue/jump:
