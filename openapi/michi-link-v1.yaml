openapi: 3.0.3
info:
  title: Michi Link API
  description: |
    The Michi Link API provides a comprehensive interface for managing
    multi-room audio systems. It supports device pairing, music library
    management, playback control, queue manipulation, room grouping,
    and real-time event streaming. All endpoints are versioned under /api/v1.

    Authentication is performed via Bearer tokens obtained through the
    pairing flow. Tokens must be sent in the Authorization header.
  version: 1.0.0
  contact:
    name: Michi Link Support
    url: https://michi.link/support
    email: api@michi.link
  license:
    name: MIT

servers:
  - url: http://{host}:{port}/api/v1
    description: Local Michi Link server instance
    variables:
      host:
        default: localhost
        description: Hostname or IP address of the Michi Link server
      port:
        default: "8400"
        description: |
          Port number of the Michi Link server. Defaults to 8400 for music
          player, mobile, and standard receivers; the micro server profile
          uses 8500. The discovery announcement advertises the actual port.

tags:
  - name: Server
    description: Server metadata, health checks, and clock endpoints.
  - name: Pairing
    description: Device pairing handshake and token management.
  - name: Library
    description: Music library scanning and statistics.
  - name: Tracks
    description: Track metadata management and retrieval.
  - name: Albums
    description: Album metadata management and retrieval.
  - name: Artists
    description: Artist metadata management and retrieval.
  - name: Search
    description: Unified search across the music library.
  - name: Streaming
    description: Audio streaming endpoints for playback devices.
  - name: Playback
    description: Playback session control and state.
  - name: Queue
    description: Playback queue manipulation and repeat/shuffle controls.
  - name: Playlists
    description: Playlist creation, management, and retrieval.
  - name: Devices
    description: Device discovery, registration, and management.
  - name: Sync
    description: Multi-device playback synchronization.
  - name: Rooms
    description: Multi-room grouping and room playback control.
  - name: Events
    description: Real-time event streaming for state changes.
  - name: Receivers
    description: Receiver device management and session control.
  - name: ReceiverLite
    description: Lightweight receiver protocol (v1-lite) endpoints.

paths:
  # ============================================================================
  # SERVER
  # ============================================================================
  /server/info:
    get:
      tags:
        - Server
      summary: Get server information
      description: |
        Returns metadata about the Michi Link server instance including version, uptime, and capabilities.
        This endpoint is public and does not require authentication.
      operationId: getServerInfo
      security: []
      responses:
        "200":
          description: Server information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "500":
          $ref: "#/components/responses/InternalError"

  /status:
    get:
      tags:
        - Server
      summary: Server health check
      description: |
        Public health check endpoint. Returns server status without requiring authentication.
        This is the official health check; /server/ping and /server/clock are deprecated.
      operationId: getServerStatus
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: integer
                    description: Server uptime in seconds
                  version:
                    type: string
                    description: Server software version
                required:
                  - status
        "500":
          $ref: "#/components/responses/InternalError"

  /server/ping:
    get:
      tags:
        - Server
      summary: Ping the server
      description: |
        Health check endpoint that returns a simple pong response to verify server availability.
        Note: This endpoint is deprecated. Use GET /status instead.
      operationId: pingServer
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pong
                required:
                  - status
        "500":
          $ref: "#/components/responses/InternalError"

  /server/clock:
    get:
      tags:
        - Server
      summary: Get server clock
      description: |
        Returns the current server time in ISO 8601 format, useful for time synchronization.
        Note: This endpoint is deprecated. Use GET /status instead.
      operationId: getServerClock
      security: []
      responses:
        "200":
          description: Server clock retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: string
                    format: date-time
                    example: "2026-06-29T14:30:00Z"
                required:
                  - server_time
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # PAIRING
  # ============================================================================
  /pair/start:
    post:
      tags:
        - Pairing
      summary: Start pairing
      description: |
        Initiates the pairing handshake with the Michi Link server. Returns a
        pairing session; the server displays a 6-digit PIN on the initiating
        device, which is never transmitted over the network. The client
        completes the handshake via POST /pair/confirm.
      operationId: startPairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairStartRequest"
      responses:
        "200":
          description: Pairing challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /pair/confirm:
    post:
      tags:
        - Pairing
      summary: Confirm pairing
      description: |
        Completes the pairing process by confirming the session with the PIN
        displayed on the initiating device. Returns opaque bearer tokens for
        subsequent API calls. An incorrect PIN is reported as 401 with code
        PAIRING_PIN_MISMATCH; consumed sessions return PAIRING_ALREADY_CONSUMED.
      operationId: confirmPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairConfirmRequest"
      responses:
        "200":
          description: Pairing confirmed, token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairConfirmResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_REQUEST
                  message: Invalid request parameters
        "401":
          description: Incorrect PIN for this pairing session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PAIRING_PIN_MISMATCH
                  message: The provided PIN does not match this pairing session
        "404":
          description: Pairing session does not exist or has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PAIRING_NOT_FOUND
                  message: The pairing session was not found or has expired
        "409":
          description: Pairing session was already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PAIRING_ALREADY_CONSUMED
                  message: This pairing session has already been used
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /token/refresh:
    post:
      tags:
        - Pairing
      summary: Refresh authentication token
      description: Exchanges a refresh token for a new access token. Used when the current access token has expired.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /pair/status:
    get:
      tags:
        - Pairing
      summary: Get pairing status
      description: Returns the current pairing status of the client with the server.
      operationId: getPairingStatus
      security: []
      responses:
        "200":
          description: Pairing status
          content:
            application/json:
              schema:
                type: object
                properties:
                  paired:
                    type: boolean
                    description: Whether the client is currently paired
                  device_id:
                    type: string
                    description: The unique identifier of the paired device
                  paired_at:
                    type: string
                    format: date-time
                    description: Timestamp when pairing occurred
                required:
                  - paired
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # LIBRARY
  # ============================================================================
  /library/stats:
    get:
      tags:
        - Library
      summary: Get library statistics
      description: Returns aggregate statistics about the music library including total tracks, albums, artists, and total duration.
      operationId: getLibraryStats
      responses:
        "200":
          description: Library statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /library/scan:
    post:
      tags:
        - Library
      summary: Trigger library scan
      description: Initiates a full or incremental scan of the configured music directories to update the library.
      operationId: triggerLibraryScan
      parameters:
        - name: incremental
          in: query
          required: false
          description: If true, performs an incremental scan instead of a full scan
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Scan initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                    format: uuid
                    description: Unique identifier for the scan operation
                  status:
                    type: string
                    example: started
                required:
                  - scan_id
                  - status
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A scan is already in progress
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /library/scan/{scanId}:
    get:
      tags:
        - Library
      summary: Get scan status
      description: Returns the current status and progress of a library scan operation.
      operationId: getScanStatus
      parameters:
        - name: scanId
          in: path
          required: true
          description: The unique identifier of the scan
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                      - pending
                      - scanning
                      - completed
                      - failed
                  progress:
                    type: number
                    format: float
                    description: Progress percentage (0-100)
                  started_at:
                    type: string
                    format: date-time
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  error:
                    type: string
                    nullable: true
                required:
                  - scan_id
                  - status
                  - progress
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # TRACKS
  # ============================================================================
  /tracks:
    get:
      tags:
        - Tracks
      summary: List tracks
      description: Retrieves a paginated list of all tracks in the library. Supports sorting and filtering by various criteria.
      operationId: listTracks
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum:
              - title
              - artist
              - album
              - duration
              - trackNumber
              - createdAt
            default: title
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: genre
          in: query
          required: false
          description: Filter by genre
          schema:
            type: string
        - name: year
          in: query
          required: false
          description: Filter by release year
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Search query for filtering tracks
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of tracks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Tracks
      summary: Add track metadata
      description: Adds or updates metadata for a track in the library.
      operationId: addTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Track"
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Track with this ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /tracks/{trackId}:
    get:
      tags:
        - Tracks
      summary: Get track
      description: Returns detailed metadata for a specific track by its unique identifier.
      operationId: getTrack
      parameters:
        - name: trackId
          in: path
          required: true
          description: The unique identifier of the track
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Track details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Tracks
      summary: Update track
      description: Updates the metadata of an existing track.
      operationId: updateTrack
      parameters:
        - name: trackId
          in: path
          required: true
          description: The unique identifier of the track
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Track"
      responses:
        "200":
          description: Track updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Tracks
      summary: Delete track
      description: Removes a track from the library by its unique identifier.
      operationId: deleteTrack
      parameters:
        - name: trackId
          in: path
          required: true
          description: The unique identifier of the track
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Track deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # ALBUMS
  # ============================================================================
  /albums:
    get:
      tags:
        - Albums
      summary: List albums
      description: Retrieves a paginated list of all albums in the library.
      operationId: listAlbums
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum:
              - title
              - artist
              - year
              - createdAt
            default: title
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: search
          in: query
          required: false
          description: Search query for filtering albums
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of albums
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Album"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /albums/{albumId}:
    get:
      tags:
        - Albums
      summary: Get album
      description: Returns detailed metadata for a specific album, including its track listing.
      operationId: getAlbum
      parameters:
        - name: albumId
          in: path
          required: true
          description: The unique identifier of the album
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Album details with tracks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Album"
                  - type: object
                    properties:
                      tracks:
                        type: array
                        items:
                          $ref: "#/components/schemas/Track"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Albums
      summary: Update album
      description: Updates the metadata of an existing album.
      operationId: updateAlbum
      parameters:
        - name: albumId
          in: path
          required: true
          description: The unique identifier of the album
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Album"
      responses:
        "200":
          description: Album updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Albums
      summary: Delete album
      description: Removes an album and all its tracks from the library.
      operationId: deleteAlbum
      parameters:
        - name: albumId
          in: path
          required: true
          description: The unique identifier of the album
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Album deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /albums/{albumId}/tracks:
    get:
      tags:
        - Albums
      summary: List album tracks
      description: Returns the track listing for a specific album.
      operationId: getAlbumTracks
      parameters:
        - name: albumId
          in: path
          required: true
          description: The unique identifier of the album
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Album track listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  album_id:
                    type: string
                    format: uuid
                  tracks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Track"
                required:
                  - album_id
                  - tracks
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # ARTISTS
  # ============================================================================
  /artists:
    get:
      tags:
        - Artists
      summary: List artists
      description: Retrieves a paginated list of all artists in the library.
      operationId: listArtists
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (1-based)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum:
              - name
              - albumCount
              - trackCount
              - createdAt
            default: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: search
          in: query
          required: false
          description: Search query for filtering artists
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of artists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Artist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /artists/{artistId}:
    get:
      tags:
        - Artists
      summary: Get artist
      description: Returns detailed information about a specific artist.
      operationId: getArtist
      parameters:
        - name: artistId
          in: path
          required: true
          description: The unique identifier of the artist
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artist details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Artists
      summary: Update artist
      description: Updates the metadata of an existing artist.
      operationId: updateArtist
      parameters:
        - name: artistId
          in: path
          required: true
          description: The unique identifier of the artist
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Artist"
      responses:
        "200":
          description: Artist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Artists
      summary: Delete artist
      description: Removes an artist and all associated tracks from the library.
      operationId: deleteArtist
      parameters:
        - name: artistId
          in: path
          required: true
          description: The unique identifier of the artist
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Artist deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /artists/{artistId}/albums:
    get:
      tags:
        - Artists
      summary: List artist albums
      description: Returns all albums by a specific artist.
      operationId: getArtistAlbums
      parameters:
        - name: artistId
