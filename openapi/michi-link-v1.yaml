        - Rooms
      summary: Create room
      description: Creates a new room that can group multiple devices for synchronized playback.
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateRequest"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rooms/{roomId}:
    get:
      tags:
        - Rooms
      summary: Get room
      description: Returns detailed information about a specific room.
      operationId: getRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - Rooms
      summary: Update room
      description: Updates the configuration of an existing room, including its name and member devices.
      operationId: updateRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdateRequest"
      responses:
        "200":
          description: Room updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Rooms
      summary: Delete room
      description: Permanently removes a room and disbands the device group.
      operationId: deleteRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Room deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /rooms/{roomId}/play:
    post:
      tags:
        - Rooms
      summary: Play in room
      description: Starts playback in a specific room with the given tracks or playlist.
      operationId: playInRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomPlayRequest"
      responses:
        "200":
          description: Playback started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /rooms/{roomId}/devices:
    get:
      tags:
        - Rooms
      summary: List room devices
      description: Returns all devices that are members of a specific room.
      operationId: getRoomDevices
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Room devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                    format: uuid
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceInfo"
                required:
                  - room_id
                  - devices
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - Rooms
      summary: Add device to room
      description: Adds a device to a room for synchronized multi-room playback.
      operationId: addDeviceToRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the device to add
              required:
                - device_id
      responses:
        "200":
          description: Device added to room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Device is already in another room
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - Rooms
      summary: Remove device from room
      description: Removes a device from a room without deleting the room itself.
      operationId: removeDeviceFromRoom
      parameters:
        - name: roomId
          in: path
          required: true
          description: The unique identifier of the room
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the device to remove
              required:
                - device_id
      responses:
        "200":
          description: Device removed from room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # EVENTS (WebSocket)
  # ============================================================================
  /events:
    get:
      tags:
        - Events
      summary: Subscribe to events
      description: |
        WebSocket endpoint for real-time event notifications. Establishes a
        WebSocket connection to receive events from the Michi Link server.
        Events include playback state changes, queue updates, library
        modifications, device status changes, and errors. The connection is
        long-lived and events are pushed as they occur.  This is NOT a primary
        API transport; all standard API operations use the REST endpoints.
      operationId: subscribeToEvents
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated list of event types to subscribe to. If omitted, all events are received.
          schema:
            type: string
            example: playback,queue,library
        - name: heartbeat
          in: query
          required: false
          description: Heartbeat interval in seconds (keeps the connection alive)
          schema:
            type: integer
            minimum: 5
            maximum: 120
            default: 30
      # ignored: WebSocket upgrade endpoint - 101 Switching Protocols is the only success
      # response by RFC 6455; a 2XX would violate the protocol contract.
      responses:
        "101":
          description: WebSocket connection upgraded
          headers:
            Upgrade:
              schema:
                type: string
                default: websocket
            Connection:
              schema:
                type: string
                default: Upgrade
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # RECEIVERS
  # ============================================================================
  /receivers:
    get:
      tags:
        - Receivers
      summary: List receivers
      description: Returns all discovered and registered audio receivers on the network.
      operationId: listReceivers
      responses:
        "200":
          description: List of receivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  receivers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceInfo"
                required:
                  - receivers
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /receivers/discover:
    post:
      tags:
        - Receivers
      summary: Discover receivers
      description: Triggers network discovery for new audio receivers. Returns a list of discovered devices.
      operationId: discoverReceivers
      parameters:
        - name: timeout
          in: query
          required: false
          description: Discovery timeout in seconds
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 5
      responses:
        "200":
          description: Discovered receivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  discovered:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceInfo"
                required:
                  - discovered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /receivers/{receiverId}:
    get:
      tags:
        - Receivers
      summary: Get receiver
      description: Returns detailed information about a specific audio receiver.
      operationId: getReceiver
      parameters:
        - name: receiverId
          in: path
          required: true
          description: The unique identifier of the receiver
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Receiver details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ============================================================================
  # RECEIVER LITE
  # ============================================================================
  /receiver-lite/info:
    get:
      tags:
        - ReceiverLite
      summary: Get receiver-lite info
      description: Returns capability and status information for ReceiverLite instances.
      operationId: getReceiverLiteInfo
      responses:
        "200":
          description: ReceiverLite information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiverInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /receiver-lite/session:
    post:
      tags:
        - ReceiverLite
      summary: Create receiver-lite session
      description: Creates a lightweight playback session for a ReceiverLite endpoint.
      operationId: createReceiverLiteSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiverSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: active
                required:
                  - session_id
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags:
        - ReceiverLite
      summary: Destroy receiver-lite session
      description: Ends an active ReceiverLite playback session.
      operationId: destroyReceiverLiteSession
      responses:
        "204":
          description: Session destroyed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /receiver-lite/heartbeat:
    post:
      tags:
        - ReceiverLite
      summary: Send heartbeat
      description: Sends a periodic heartbeat to keep the ReceiverLite session alive and report status.
      operationId: sendReceiverLiteHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiverHeartbeat"
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  server_time:
                    type: string
                    format: date-time
                required:
                  - status
                  - server_time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /receiver-lite/volume:
    put:
      tags:
        - ReceiverLite
      summary: Set receiver-lite volume
      description: Sets the volume level on a specific ReceiverLite endpoint.
      operationId: setReceiverLiteVolume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiverVolumeRequest"
      responses:
        "200":
          description: Volume updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  volume:
                    type: integer
                    minimum: 0
                    maximum: 100
                  muted:
                    type: boolean
                required:
                  - volume
                  - muted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /receiver-lite/firmware:
    get:
      tags:
        - ReceiverLite
      summary: Get firmware info
      description: Returns the current firmware version and update availability for ReceiverLite.
      operationId: getReceiverLiteFirmware
      responses:
        "200":
          description: Firmware information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiverFirmware"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags:
        - ReceiverLite
      summary: Update firmware
      description: Initiates a firmware update on the ReceiverLite device.
      operationId: updateReceiverLiteFirmware
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: URL to the firmware update file
                checksum:
                  type: string
                  description: SHA-256 checksum of the firmware file
              required:
                - url
                - checksum
      responses:
        "202":
          description: Firmware update initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updating
                  started_at:
                    type: string
                    format: date-time
                required:
                  - status
                  - started_at
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Update already in progress
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /receiver-lite/config:
    get:
      tags:
        - ReceiverLite
      summary: Get receiver-lite config
      description: Returns the current configuration of the ReceiverLite device.
      operationId: getReceiverLiteConfig
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_name:
                    type: string
                  audio_output:
                    type: string
                    enum:
                      - hdmi
                      - optical
                      - analog
                      - bluetooth
                  sample_rate:
                    type: integer
                    example: 48000
                  bit_depth:
                    type: integer
                    example: 24
                  buffer_size:
                    type: integer
                    example: 2048
                  volume_control:
                    type: boolean
                  auto_sync:
                    type: boolean
                required:
                  - device_name
                  - audio_output
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags:
        - ReceiverLite
      summary: Update receiver-lite config
      description: Updates the configuration of the ReceiverLite device.
      operationId: updateReceiverLiteConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                audio_output:
                  type: string
                  enum:
                    - hdmi
                    - optical
                    - analog
                    - bluetooth
                sample_rate:
                  type: integer
                  enum:
                    - 44100
                    - 48000
                    - 96000
                bit_depth:
                  type: integer
                  enum:
                    - 16
                    - 24
                    - 32
                buffer_size:
                  type: integer
                  minimum: 128
                  maximum: 8192
                volume_control:
                  type: boolean
                auto_sync:
                  type: boolean
      responses:
        "200":
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: applied
                  requires_reboot:
                    type: boolean
                required:
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque bearer token (not JWT) issued by the pairing flow or /token/refresh.
        Include in the Authorization header as: Authorization: Bearer <token>

  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CONFLICT
              message: The request conflicts with the current state of the resource
    BadRequest:
      description: Bad request - invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_REQUEST
              message: Invalid request parameters
              details:
                field: track_id
                reason: must be a valid UUID
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid authentication token
    Forbidden:
      description: Forbidden - the authenticated user does not have permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: Insufficient permissions for this operation
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found
              details:
                resource: track
                id: 123e4567-e89b-12d3-a456-426614174000
    RateLimited:
      description: Too many requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests, please retry later
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred

  schemas:
    # --------------------------------------------------------------------------
    # ERROR
    # --------------------------------------------------------------------------
    Error:
      type: object
      description: Standard error envelope
      properties:
        error:
          type: object
          description: Error details
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - INVALID_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL_ERROR
                - NOT_IMPLEMENTED
                - PAIRING_EXPIRED
                - PAIRING_ATTEMPTS_EXCEEDED
                - PAIRING_KEY_MISMATCH
                - IDENTITY_CORRUPTED
                - SIGNATURE_INVALID
                - REPLAY_DETECTED
                - IDEMPOTENCY_KEY_REUSE
                - TRACK_NOT_FOUND
                - IMPORT_SESSION_EXPIRED
                - PAIRING_NOT_FOUND
                - PAIRING_ALREADY_CONSUMED
                - PAIRING_PIN_MISMATCH
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              additionalProperties: true
              description: Additional error context
            request_id:
              type: string
              format: uuid
              description: Request identifier for correlation and support
      required:
        - error

    # --------------------------------------------------------------------------
    # SERVER INFO
    # --------------------------------------------------------------------------
    ServerInfo:
      type: object
      description: Server identity and capabilities payload. api_version is always v1 or v1-lite.
      required:
        - service
        - name
        - version
        - api_version
        - roles
        - auth
        - features
      properties:
        service:
          type: string
          description: Service identifier
          enum:
            - michi-music-player
            - michi-micro-server
            - michi-mobile
            - michi-stream-standard
            - michi-stream-hifi
          example: michi-micro-server
        name:
          type: string
          description: Human-readable server name (user-configurable)
          example: Michi Micro Server
        server_id:
          type: string
          format: uuid
          description: Unique server UUID
        version:
          type: string
          description: Application version (internal, not contract version)
          example: 1.2.3
        api_version:
          type: string
          description: API contract version. Never changes without a deliberate breaking change.
          enum:
            - v1
            - v1-lite
          example: v1
        roles:
          type: array
          description: Active roles
          items:
            type: string
          uniqueItems: true
          minItems: 1
          example:
            - home_server
            - library_server
            - stream_server
        features:
          type: object
          description: Boolean capability flags
          additionalProperties:
            type: boolean
          minProperties: 1
          example:
            library: true
            search: true
            streaming: true
            sync_manifest: true
            playback: true
            queue: true
            artwork: true
            events: false
        identity_scheme:
          type: string
          description: Identity derivation scheme. Present when identity is initialized.
          enum:
            - ed25519-blake3-v1
        michi_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Identity derived as base64url(BLAKE3(public_key)), 43 chars, or null if identity not initialized
          nullable: true
        public_key:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Ed25519 public key in base64url, 43 chars, or null if identity not initialized
          nullable: true
        auth:
          type: object
          description: Authentication configuration. REQUIRED for all servers.
          required:
            - required
          properties:
            required:
              type: boolean
              description: Whether authentication is mandatory. Always true for v1.
              enum:
                - true
            strategy:
              type: string
              description: Auth strategy
              enum:
                - PLAYER_PASSWORD
                - SERVER_CODE
                - RECEIVER_BUTTON
                - ED25519_CHALLENGE
                - LEGACY
            token_refresh:
              type: boolean
              description: Whether /token/refresh is supported

    # --------------------------------------------------------------------------
    # DEVICE INFO
    # --------------------------------------------------------------------------
    DeviceInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique device identifier
        name:
          type: string
          description: Human-readable device name
        type:
          type: string
          description: Device type
          enum:
            - receiver
            - receiver_lite
            - controller
            - mobile
            - desktop
            - web
        model:
          type: string
          description: Device model identifier
        manufacturer:
          type: string
          description: Device manufacturer
        firmware_version:
          type: string
          description: Current firmware version
        ip_address:
          type: string
          format: ipv4
          description: Device IP address on the network
        mac_address:
          type: string
          description: Device MAC address
        status:
          type: string
          description: Current device status
          enum:
            - online
            - offline
            - busy
            - unavailable
        capabilities:
          type: array
          items:
            type: string
          description: Device capabilities
        last_seen:
          type: string
          format: date-time
          description: Timestamp of last communication
        room_id:
          type: string
          format: uuid
          nullable: true
          description: Room this device is assigned to, if any
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Current volume level
        muted:
          type: boolean
          description: Whether the device is muted
        paired_at:
          type: string
          format: date-time
          description: When the device was paired
      required:
        - id
        - name
        - type
        - status

    # --------------------------------------------------------------------------
    # PAIR START
    # --------------------------------------------------------------------------
    PairStartRequest:
      type: object
      description: Canonical v1 request to initiate a pairing handshake. Strict snake_case field names; camelCase variants (e.g. deviceId) are rejected.
      required:
        - device_name
        - device_type
        - roles
        - auth_strategy
        - michi_id
        - public_key
        - challenge_nonce
        - challenge_signature
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Initiating device display name
        device_type:
          type: string
          description: Initiating device type
          enum:
            - mobile
            - desktop
            - receiver
        roles:
          type: array
          description: Requested canonical roles for this device
          items:
            type: string
            enum:
              - desktop_player
              - library_master
              - sync_host
              - music_server
              - library_host
              - playback_host
              - mobile_player
              - remote_controller
              - sync_client
              - audio_receiver
          minItems: 1
          uniqueItems: true
          example:
            - mobile_player
            - remote_controller
            - sync_client
        auth_strategy:
          type: string
          description: Desired authentication strategy
          enum:
            - PLAYER_PASSWORD
            - SERVER_CODE
            - ED25519_CHALLENGE
            - RECEIVER_BUTTON
            - LEGACY
        michi_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Identity derived as base64url(BLAKE3(public_key)), exactly 43 chars, no padding
        public_key:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Ed25519 public key in base64url, exactly 43 chars, no padding
        challenge_nonce:
          type: string
          minLength: 22
          pattern: "^[A-Za-z0-9_-]{22,}$"
          description: Random nonce in base64url (at least 16 bytes, 22 chars), for ED25519_CHALLENGE challenge-response
        challenge_signature:
          type: string
          pattern: "^[A-Za-z0-9_-]{86}$"
          description: Ed25519 signature of the nonce in base64url, exactly 86 chars, no padding. Proves possession of the secret key.

    PairStartResponse:
      type: object
      description: |
        Result of a successful pairing handshake. The PIN is displayed on the
        initiating device and NEVER travels over the network in this response.
      required:
        - session_id
        - expires_at
        - attempts_remaining
        - server_michi_id
        - server_public_key
      properties:
        session_id:
          type: string
          format: uuid
          description: Unique identifier for this pairing session
        expires_at:
          type: string
          format: date-time
          description: Session expiration timestamp
        attempts_remaining:
          type: integer
          minimum: 0
          description: Number of PIN attempts remaining before the session is invalidated
        server_michi_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Server identity derived as base64url(BLAKE3(public_key)), 43 chars
        server_public_key:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Server Ed25519 public key in base64url, 43 chars

    # --------------------------------------------------------------------------
    # PAIR CONFIRM
    # --------------------------------------------------------------------------
    PairConfirmRequest:
      type: object
      description: Confirms a pairing session with the 6-digit PIN displayed by the server on the initiating device.
      required:
        - session_id
        - pin
        - michi_id
        - public_key
      properties:
        session_id:
          type: string
          format: uuid
          description: The session ID received from the pair/start response
        pin:
          type: string
          pattern: "^[0-9]{6}$"
          description: The 6-digit PIN displayed on the initiating device
        michi_id:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Identity derived as base64url(BLAKE3(public_key)), 43 chars
        public_key:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Ed25519 public key in base64url, 43 chars

    PairConfirmResponse:
      type: object
      description: Result of a successful pairing confirmation.
      required:
        - token
        - expires_in
        - device_id
        - server_id
      properties:
        token:
          type: string
          description: Opaque bearer token (not JWT) for API authentication
        refresh_token:
          type: string
          description: Optional token used to obtain a new access token via /token/refresh
        expires_in:
          type: integer
          description: Token validity duration in seconds
        device_id:
          type: string
          description: Identifier of the confirmed device
        server_id:
          type: string
          description: Identifier of the server the device is paired with

    # --------------------------------------------------------------------------
    # TOKEN REFRESH
    # --------------------------------------------------------------------------
    TokenRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: The refresh token obtained during pairing
      required:
        - refresh_token

    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: New opaque access token
        expires_in:
          type: integer
          description: Access token validity duration in seconds
        token_type:
          type: string
          example: Bearer
      required:
        - access_token
        - expires_in
        - token_type

    # --------------------------------------------------------------------------
    # LIBRARY STATS
    # --------------------------------------------------------------------------
    LibraryStats:
      type: object
      properties:
        total_tracks:
          type: integer
          description: Total number of tracks in the library
        total_albums:
          type: integer
          description: Total number of albums in the library
        total_artists:
          type: integer
          description: Total number of artists in the library
        total_playlists:
          type: integer
          description: Total number of playlists
        total_duration:
          type: number
          format: float
          description: Total duration of all tracks in seconds
        total_size:
          type: integer
          format: int64
          description: Total file size of all tracks in bytes
        genres:
          type: array
          items:
            type: string
          description: List of unique genres in the library
        last_scanned:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last library scan
        last_updated:
          type: string
          format: date-time
          description: Timestamp of the last library update
      required:
        - total_tracks
        - total_albums
        - total_artists
        - total_duration

    # --------------------------------------------------------------------------
    # TRACK
    # --------------------------------------------------------------------------
    Track:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique track identifier
        title:
          type: string
          description: Track title
        artist:
          type: string
          description: Artist name
        artist_id:
          type: string
          format: uuid
          description: Artist unique identifier
        album:
          type: string
          description: Album name
        album_id:
          type: string
          format: uuid
          description: Album unique identifier
        album_artist:
          type: string
          description: Album artist (may differ from track artist)
        track_number:
          type: integer
          description: Track number on the album
        disc_number:
          type: integer
          description: Disc number for multi-disc albums
        duration:
          type: number
          format: float
          description: Track duration in seconds
        year:
          type: integer
          description: Release year
        genre:
          type: string
          description: Track genre
        format:
          type: string
          description: Audio file format
          example: flac
        bitrate:
          type: integer
          description: Audio bitrate in kbps
        sample_rate:
          type: integer
          description: Audio sample rate in Hz
        channels:
          type: integer
          description: Number of audio channels
        size:
          type: integer
          format: int64
          description: File size in bytes
        has_cover:
          type: boolean
          description: Whether the track has embedded cover art
        rating:
          type: integer
          minimum: 0
          maximum: 5
          description: User rating (0-5)
        play_count:
          type: integer
          description: Number of times played
        last_played:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last playback
        created_at:
          type: string
          format: date-time
          description: When the track was added to the library
        updated_at:
          type: string
          format: date-time
          description: When the track metadata was last updated
      required:
        - id
        - title
        - artist
        - album

    # --------------------------------------------------------------------------
    # ALBUM
    # --------------------------------------------------------------------------
    Album:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique album identifier
        title:
          type: string
          description: Album title
        artist:
          type: string
          description: Album artist name
        artist_id:
          type: string
          format: uuid
          description: Artist unique identifier
        year:
          type: integer
          description: Release year
        genre:
          type: string
          description: Album genre
        track_count:
          type: integer
          description: Number of tracks on the album
        duration:
          type: number
          format: float
          description: Total album duration in seconds
        has_cover:
          type: boolean
          description: Whether the album has cover art
        created_at:
          type: string
          format: date-time
          description: When the album was added to the library
        updated_at:
          type: string
          format: date-time
          description: When the album metadata was last updated
      required:
        - id
        - title
        - artist

    # --------------------------------------------------------------------------
    # ARTIST
    # --------------------------------------------------------------------------
    Artist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique artist identifier
        name:
          type: string
          description: Artist name
        album_count:
          type: integer
          description: Number of albums by this artist
        track_count:
          type: integer
          description: Number of tracks by this artist
        genre:
          type: string
          description: Primary genre
        has_image:
          type: boolean
          description: Whether the artist has a profile image
        biography:
          type: string
          description: Artist biography text
        created_at:
          type: string
          format: date-time
          description: When the artist was added to the library
        updated_at:
          type: string
          format: date-time
          description: When the artist metadata was last updated
      required:
        - id
        - name

    # --------------------------------------------------------------------------
    # SEARCH RESULTS
    # --------------------------------------------------------------------------
    SearchResults:
      type: object
      properties:
        query:
          type: string
          description: The original search query
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
          description: Matching tracks
        albums:
          type: array
          items:
            $ref: "#/components/schemas/Album"
          description: Matching albums
        artists:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
          description: Matching artists
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/Playlist"
          description: Matching playlists
        total_tracks:
          type: integer
          description: Total number of matching tracks
        total_albums:
          type: integer
          description: Total number of matching albums
        total_artists:
          type: integer
          description: Total number of matching artists
        total_playlists:
          type: integer
          description: Total number of matching playlists
      required:
        - query
        - tracks
        - albums
        - artists
        - total_tracks
        - total_albums
        - total_artists

    # --------------------------------------------------------------------------
    # PLAYLIST
    # --------------------------------------------------------------------------
    Playlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique playlist identifier
        name:
          type: string
          description: Playlist name
        description:
          type: string
          nullable: true
          description: Playlist description
        owner_id:
          type: string
          format: uuid
          description: Identifier of the playlist owner
        owner_name:
          type: string
          description: Name of the playlist owner
        is_public:
          type: boolean
          description: Whether the playlist is publicly accessible
        track_count:
          type: integer
          description: Number of tracks in the playlist
        duration:
          type: number
          format: float
          description: Total duration in seconds
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
          description: List of tracks in the playlist
        created_at:
          type: string
          format: date-time
          description: When the playlist was created
        updated_at:
          type: string
          format: date-time
          description: When the playlist was last modified
      required:
        - id
        - name
        - owner_id
        - track_count
        - created_at

    # --------------------------------------------------------------------------
    # PLAYLIST CREATE REQUEST
    # --------------------------------------------------------------------------
    PlaylistCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Name for the new playlist
        description:
          type: string
          description: Optional description for the playlist
        is_public:
          type: boolean
          description: Whether the playlist should be public
          default: false
        track_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Initial track IDs to add to the playlist
      required:
        - name

    # --------------------------------------------------------------------------
    # PLAYLIST UPDATE REQUEST
    # --------------------------------------------------------------------------
    PlaylistUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated playlist name
        description:
          type: string
          nullable: true
          description: Updated playlist description
        is_public:
          type: boolean
          description: Updated public visibility setting
      minProperties: 1

    # --------------------------------------------------------------------------
    # PLAYLIST TRACKS UPDATE REQUEST
    # --------------------------------------------------------------------------
    PlaylistTracksUpdateRequest:
      type: object
      properties:
        track_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Track IDs to add or set
      required:
        - track_ids

    # --------------------------------------------------------------------------
    # SYNC MANIFEST
    # --------------------------------------------------------------------------
    SyncManifest:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque cursor string representing the current manifest state. Pass this to /sync/delta to get changes since this version.
        tracks_checksum:
          type: string
          description: Checksum of all track data
        albums_checksum:
          type: string
          description: Checksum of all album data
        artists_checksum:
          type: string
          description: Checksum of all artist data
        playlists_checksum:
          type: string
          description: Checksum of all playlist data
        updated_at:
          type: string
          format: date-time
          description: When the manifest was last updated
      required:
        - cursor
        - tracks_checksum
        - albums_checksum
        - artists_checksum
        - playlists_checksum

    # --------------------------------------------------------------------------
    # SYNC DELTA
    # --------------------------------------------------------------------------
    SyncDelta:
      type: object
      properties:
        cursor:
          type: string
          description: Opaque cursor from a previous SyncManifest or delta response
      required:
        - cursor

    # --------------------------------------------------------------------------
    # SYNC STATE REQUEST
    # --------------------------------------------------------------------------
    SyncStateRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: The playback session to synchronize
        track_id:
          type: string
          format: uuid
          description: Currently playing track ID
        position_ms:
          type: integer
          description: Current playback position in milliseconds
        state:
          type: string
          enum:
            - playing
            - paused
            - stopped
          description: Current playback state
        timestamp:
          type: string
          format: date-time
          description: Client timestamp for latency calculation
      required:
        - session_id
        - track_id
        - position_ms
        - state
        - timestamp

    # --------------------------------------------------------------------------
    # PLAYBACK STATE
    # --------------------------------------------------------------------------
    PlaybackState:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Active playback session identifier
        state:
          type: string
          enum:
            - playing
            - paused
            - stopped
            - loading
          description: Current playback state
        track:
          type: object
          allOf:
            - $ref: "#/components/schemas/Track"
          nullable: true
          description: Currently playing track
        position_ms:
          type: integer
          description: Current position in milliseconds
        duration_ms:
          type: integer
          description: Track duration in milliseconds
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Current volume level
        muted:
          type: boolean
          description: Whether audio is muted
        shuffle_enabled:
          type: boolean
          description: Whether shuffle is active
        repeat_mode:
          type: string
          enum:
            - off
            - one
            - all
          description: Current repeat mode. "off" replaces the legacy boolean false value.
        device_id:
          type: string
          format: uuid
          nullable: true
          description: Active playback device
        room_id:
          type: string
          format: uuid
          nullable: true
          description: Active playback room
        updated_at:
          type: string
          format: date-time
          description: When the state was last updated
      required:
        - session_id
        - state
        - position_ms
        - duration_ms
        - volume
        - muted
        - shuffle_enabled
        - repeat_mode

    # --------------------------------------------------------------------------
    # PLAYBACK CONTROL REQUEST
    # --------------------------------------------------------------------------
    PlaybackControlRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum: [play, pause, toggle, stop, next, previous, seek, set_volume, mute, unmute, shuffle, repeat]
        value:
          anyOf:
            - type: integer
            - type: string
            - type: boolean
            - type: object
              nullable: true
              description: Null value (clears the parameter)
          description: Parameter value for seek (ms), volume (0-100), shuffle (bool), repeat (off/one/all)

    # --------------------------------------------------------------------------
    # PLAYBACK SESSION REQUEST
    # --------------------------------------------------------------------------
    PlaybackSessionRequest:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: Device to create the session on
        room_id:
          type: string
          format: uuid
          description: Room to create the session in
        start_playing:
          type: boolean
          description: Whether to start playback immediately
          default: false
        track_id:
          type: string
          format: uuid
          description: Initial track to play
        track_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Initial queue of track IDs
        playlist_id:
          type: string
          format: uuid
          description: Playlist to load into the queue
      anyOf:
        - required:
            - device_id
        - required:
            - room_id

    # --------------------------------------------------------------------------
    # QUEUE
    # --------------------------------------------------------------------------
    Queue:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Associated playback session
        now_playing:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              description: Queue item identifier
            track:
              $ref: "#/components/schemas/Track"
            position_ms:
              type: integer
            duration_ms:
              type: integer
          description: Currently playing item
        upcoming:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Queue item identifier
              track:
                $ref: "#/components/schemas/Track"
          description: Upcoming items in the queue
        history:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              track:
                $ref: "#/components/schemas/Track"
              played_at:
                type: string
                format: date-time
          description: Recently played items
        shuffle_enabled:
          type: boolean
        repeat_mode:
          type: string
          enum:
            - off
            - one
            - all
          description: Repeat mode. "off" replaces the legacy boolean false value.
        total_upcoming:
          type: integer
          description: Total number of upcoming items
        total_duration:
          type: number
          format: float
          description: Total duration of upcoming items in seconds
      required:
        - session_id
        - now_playing
        - upcoming
        - history
        - shuffle_enabled
        - repeat_mode

    # --------------------------------------------------------------------------
    # QUEUE ADD REQUEST
    # --------------------------------------------------------------------------
    QueueAddRequest:
      type: object
      properties:
        track_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Track IDs to add to the queue
        position:
          type: integer
          description: 0-based position to insert the tracks at. Use -1 or omit to add to the end.
          minimum: -1
          default: -1
        play_next:
          type: boolean
          description: If true, insert after the currently playing track
          default: false
      required:
        - track_ids

    # --------------------------------------------------------------------------
    # QUEUE JUMP REQUEST
    # --------------------------------------------------------------------------
    QueueJumpRequest:
      type: object
      properties:
        item_id:
          type: string
          format: uuid
          description: The queue item ID to jump to
      required:
        - item_id

    # --------------------------------------------------------------------------
    # QUEUE REORDER REQUEST
    # --------------------------------------------------------------------------
    QueueReorderRequest:
      type: object
      properties:
        item_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Queue item IDs to move, in the order they should appear
        insert_before:
          type: string
          format: uuid
          nullable: true
          description: |
            Queue item ID before which the items should be inserted.
            Use null to move to the end.
      required:
        - item_ids

    # --------------------------------------------------------------------------
    # ROOM
    # --------------------------------------------------------------------------
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique room identifier
        name:
          type: string
          description: Room name
        description:
          type: string
          nullable: true
          description: Room description
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceInfo"
          description: Devices assigned to this room
        device_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of devices assigned to this room
        is_active:
          type: boolean
          description: Whether the room has active playback
        playback_state:
          type: object
          allOf:
            - $ref: "#/components/schemas/PlaybackState"
          nullable: true
          description: Current playback state for the room
        created_at:
          type: string
          format: date-time
          description: When the room was created
        updated_at:
          type: string
          format: date-time
          description: When the room was last modified
      required:
        - id
        - name
        - device_ids
        - is_active

    # --------------------------------------------------------------------------
    # ROOM CREATE REQUEST
    # --------------------------------------------------------------------------
    RoomCreateRequest:
      type: object
      properties:
        name:
          type: string
          description: Name for the new room
        description:
          type: string
          description: Optional room description
        device_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Initial device IDs to include in the room
      required:
        - name

    # --------------------------------------------------------------------------
    # ROOM UPDATE REQUEST
    # --------------------------------------------------------------------------
    RoomUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated room name
        description:
          type: string
          nullable: true
          description: Updated room description
      minProperties: 1

    # --------------------------------------------------------------------------
    # ROOM PLAY REQUEST
    # --------------------------------------------------------------------------
    RoomPlayRequest:
      type: object
      properties:
        track_id:
          type: string
          format: uuid
          description: Track ID to play immediately
        track_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Track IDs to queue
        playlist_id:
          type: string
          format: uuid
          description: Playlist ID to play
        shuffle:
          type: boolean
          description: Whether to enable shuffle
        repeat_mode:
          type: string
          enum:
            - off
            - one
            - all
          description: Repeat mode to set. "off" replaces the legacy boolean false value.
      anyOf:
        - required:
            - track_id
        - required:
            - track_ids
        - required:
            - playlist_id

    # --------------------------------------------------------------------------
    # PAGINATED RESPONSE
    # --------------------------------------------------------------------------
    PaginatedResponse:
      type: object
      properties:
        page:
          type: integer
          description: Current page number (1-based)
        limit:
          type: integer
          description: Maximum items per page
        total:
          type: integer
          description: Total number of items across all pages
        total_pages:
          type: integer
          description: Total number of pages
        has_next:
          type: boolean
          description: Whether there is a next page
        has_prev:
          type: boolean
          description: Whether there is a previous page
      required:
        - page
        - limit
        - total
        - total_pages

    # --------------------------------------------------------------------------
    # RECEIVER INFO (ReceiverLite)
    # --------------------------------------------------------------------------
    ReceiverInfo:
      type: object
      description: |
        Lightweight receiver device info used in the v1-lite protocol.
        Quality tiers: Standard (michi-stream-standard) supports pcm_s16le only,
        max sample rate 96000, max 2 channels; Hi-Fi (michi-stream-hifi)
        supports pcm_s16le + pcm_s24le, max sample rate 192000, max 2 channels.
      properties:
        service:
          type: string
          description: Receiver service identifier (quality tier)
          enum:
            - michi-stream-standard
            - michi-stream-hifi
          example: michi-stream-standard
        device_id:
          type: string
          description: Unique receiver identifier
        device_name:
          type: string
          description: Receiver device name
        model:
          type: string
          description: Receiver hardware model
        firmware_version:
          type: string
          description: Current firmware version
        protocol_version:
          type: string
          description: Supported protocol version
        api_version:
          type: string
          description: API contract version for the receiver protocol
          enum:
            - v1-lite
          example: v1-lite
        auth:
          type: object
          description: Authentication configuration for this receiver
          properties:
            strategy:
              type: string
              description: Auth strategy
              enum:
                - RECEIVER_BUTTON
        status:
          type: string
          enum:
            - idle
            - active
            - busy
            - offline
          description: Current receiver status
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Active session identifier, if any
        uptime:
          type: integer
          description: Uptime in seconds
        audio:
          type: object
          description: Audio capabilities
          properties:
            codecs:
              type: array
              items:
                type: string
                enum:
                  - pcm_s16le
                  - pcm_s24le
              description: |
                Supported PCM codecs. Standard tier: pcm_s16le only;
                Hi-Fi tier: pcm_s16le + pcm_s24le.
        capabilities:
          type: object
          description: Receiver capabilities
          properties:
            transcoding:
              type: array
              items:
                type: string
              description: Supported output formats
            max_sample_rate:
              type: integer
              maximum: 192000
              description: |
                Maximum supported sample rate in Hz. Standard tier: 96000;
                Hi-Fi tier: 192000.
            max_bit_depth:
              type: integer
              description: Maximum supported bit depth
            max_channels:
              type: integer
              maximum: 2
              description: Maximum number of audio channels (always 2 for both tiers)
            volume_control:
              type: boolean
              description: Whether hardware volume control is supported
        network:
          type: object
          description: Network information
          properties:
            ip_address:
              type: string
            mac_address:
              type: string
            signal_strength:
              type: integer
              description: WiFi signal strength percentage (0-100)
      required:
        - device_id
        - device_name
        - firmware_version
        - status

    # --------------------------------------------------------------------------
    # RECEIVER SESSION REQUEST
    # --------------------------------------------------------------------------
    ReceiverSessionRequest:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: Receiver device to create session on
        track_id:
          type: string
          format: uuid
          description: Initial track to play
        track_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Initial queue of tracks
        playlist_id:
          type: string
          format: uuid
          description: Playlist to load
        start_playing:
          type: boolean
          default: true
          description: Whether to start playback immediately
        sync_group:
          type: string
          format: uuid
          nullable: true
          description: Sync group for multi-device synchronization
      required:
        - device_id

    # --------------------------------------------------------------------------
    # RECEIVER HEARTBEAT
    # --------------------------------------------------------------------------
    ReceiverHeartbeat:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Active session identifier
        state:
          type: string
          enum:
            - playing
            - paused
            - stopped
            - buffering
          description: Current playback state
        position_ms:
          type: integer
          description: Current playback position in milliseconds
        buffer_level:
          type: number
          format: float
          description: Buffer level as percentage (0-100)
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Current volume level
        latency_ms:
          type: integer
          description: Current network latency in milliseconds
        timestamp:
          type: string
          format: date-time
          description: Client timestamp
      required:
        - session_id
        - state
        - position_ms

    # --------------------------------------------------------------------------
    # RECEIVER VOLUME REQUEST
    # --------------------------------------------------------------------------
    ReceiverVolumeRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Active session identifier
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Volume level to set (0-100)
        muted:
          type: boolean
          description: Whether to mute or unmute
      required:
        - session_id

    # --------------------------------------------------------------------------
    # RECEIVER FIRMWARE
    # --------------------------------------------------------------------------
    ReceiverFirmware:
      type: object
      properties:
        current_version:
          type: string
          description: Currently installed firmware version
        latest_version:
          type: string
          nullable: true
          description: Latest available firmware version
        update_available:
          type: boolean
          description: Whether a firmware update is available
        release_date:
          type: string
          format: date-time
          nullable: true
          description: Release date of the latest version
        changelog:
          type: string
          nullable: true
          description: Changelog for the available update
        update_url:
          type: string
          format: uri
          nullable: true
          description: URL to download the firmware update
        checksum:
          type: string
          nullable: true
          description: SHA-256 checksum of the update file
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: When updates were last checked
        last_updated:
          type: string
          format: date-time
          nullable: true
          description: When the firmware was last updated
      required:
        - current_version
        - update_available

security:
  - BearerAuth: []
