[package]
name = "michi-identity"
version = "0.1.0"
edition = "2021"
description = "Decentralized identity and trust system for the Michi ecosystem using Ed25519 cryptography"

[dependencies]
ed25519-dalek = { version = "2", features = ["serde", "pkcs8", "pem", "rand_core"] }
blake3 = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
subtle = "2"
url = "2"
urlencoding = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rmp-serde = "1"
gethostname = "1"

[dev-dependencies]
tempfile = "3"
qrcode = "0.14"

[[example]]
name = "identity_demo"
path = "examples/identity_demo.rs"

[[example]]
name = "discovery_demo"
path = "examples/discovery_demo.rs"

[[example]]
name = "pairing_demo"
path = "examples/pairing_demo.rs"
